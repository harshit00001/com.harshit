# Server Configuration
server.port=8080

# Application Name
spring.application.name=jwt-spring-security

# Database Configuration (H2 for demo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS512Algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Redis Configuration (for token blacklisting)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms

# Security Configuration
security.enabled=true

