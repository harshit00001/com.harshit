      "Spring Boot": [spring boot, springboot, spring-boot, spring framework, spring mvc]
      Microservices: [microservice, microservices, micro-service, micro services]
      SQL: [sql, plsql, pl/sql, t-sql, rdbms, relational database]
      "REST APIs": [rest, restful, rest api, rest apis, web services, api development]
      Docker: [docker, containerization, containerisation]
