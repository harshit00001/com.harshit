server:
  port: 8092

spring:
  application:
    name: jobpulse
  # Companies live in an external file so they can be edited without rebuilding.
  config:
    import: optional:file:./config/companies.yml
  datasource:
    url: jdbc:h2:file:./data/jobpulse;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.harshit.jobpulse: INFO

jobpulse:
  crawl:
    schedule-enabled: true
    run-on-startup: true
    # Every 12 hours. Career pages do not change minute to minute.
    cron: "0 0 */12 * * *"
    request-delay-millis: 400
    connect-timeout-seconds: 15
    read-timeout-seconds: 40
    max-retries: 2

  # India-only gate, applied before scoring.
  location-filter:
    enabled: true
    keep-unknown-locations: false
    countries:
      - India
      - Bharat
    cities:
      - bengaluru
      - bangalore
      - pune
      - hyderabad
      - chennai
      - mumbai
      - navi mumbai
      - thane
      - delhi
      - new delhi
      - noida
      - greater noida
      - gurgaon
      - gurugram
      - kolkata
      - kochi
      - cochin
      - indore
      - ahmedabad
      - gandhinagar
      - jaipur
      - coimbatore
      - mysore
      - mysuru
      - trivandrum
      - thiruvananthapuram
      - nagpur
      - bhubaneswar
      - chandigarh
      - vadodara
      - visakhapatnam
      - vizag
      - goa
      - lucknow
      - bhopal
      - nashik
    blocked-countries:
      - United States
      - United Kingdom
      - Canada
      - Australia
      - Mexico
      - Philippines
      - Singapore
      - Japan
      - China
      - Germany
      - France
      - Spain
