# ---------------------------------------------------------------------------
# JobPulse company registry
#
# Add a company by appending a block here and restarting. No code changes.
#
# Pick the connector that matches how the career page serves its data:
#   WORKDAY    - *.myworkdayjobs.com  (Accenture, Salesforce, Infosys BPM, ...)
#   ASHBY      - jobs.ashbyhq.com     (Tekion, many scale-ups)
#   GREENHOUSE - boards.greenhouse.io
#   LEVER      - jobs.lever.co
#   HTML       - server-rendered list, parsed with CSS selectors
#
# How to identify the connector for a new career URL:
#   1. Open the career page and check the network tab for a JSON request.
#   2. If the apply button points at myworkdayjobs.com  -> WORKDAY
#      ashbyhq.com -> ASHBY, greenhouse.io -> GREENHOUSE, lever.co -> LEVER
#   3. Only fall back to HTML when no vendor API exists.
# ---------------------------------------------------------------------------
jobpulse:
  companies:

    # -----------------------------------------------------------------------
    # Accenture — https://www.accenture.com/in-en/careers/jobsearch
    # The public page is a front end over Workday. countryFacetId pushes the
    # India restriction upstream, so non-India postings are never downloaded.
    # -----------------------------------------------------------------------
    - id: accenture
      name: Accenture
      enabled: true
      connector: WORKDAY
      career-url: https://www.accenture.com/in-en/careers/jobsearch
      max-jobs: 120
      max-detail-fetches: 45
      search-terms:
        - java
        - spring boot
        - java microservices
        - backend developer
      options:
        cxsBase: https://accenture.wd103.myworkdayjobs.com/wday/cxs/accenture/AccentureCareers
        externalBase: https://accenture.wd103.myworkdayjobs.com/AccentureCareers
        # Workday's internal id for India; found in the location facet response.
        countryFacetId: c4f78be1a8f14da0ab49ce1162348a5e

    # -----------------------------------------------------------------------
    # Tekion — https://tekion.com/careers
    # Career page is rendered by Ashby; one request returns every posting with
    # a full description and a structured postal address.
    # -----------------------------------------------------------------------
    - id: tekion
      name: Tekion
      enabled: true
      connector: ASHBY
      career-url: https://tekion.com/careers
      max-jobs: 200
      options:
        board: tekion

    # -----------------------------------------------------------------------
    # Templates — enable after filling in the identifiers.
    # -----------------------------------------------------------------------
    - id: greenhouse-example
      name: Greenhouse Example
      enabled: false
      connector: GREENHOUSE
      career-url: https://boards.greenhouse.io/example
      options:
        boardToken: example

    - id: lever-example
      name: Lever Example
      enabled: false
      connector: LEVER
      career-url: https://jobs.lever.co/example
      options:
        account: example

    - id: html-example
      name: HTML Example
      enabled: false
      connector: HTML
      career-url: https://example.com/careers
      options:
        listUrl: https://example.com/careers
        itemSelector: "div.job-card"
        titleSelector: "h3.job-title"
        locationSelector: "span.job-location"
        linkSelector: "a"
