apiVersion: v1
kind: Namespace
metadata:
  name: jobpulse
---
# Companies live in a ConfigMap so onboarding a new career page is a config change,
# not an image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobpulse-companies
  namespace: jobpulse
data:
  companies.yml: |
    jobpulse:
      companies:
        - id: accenture
          name: Accenture
          enabled: true
          connector: WORKDAY
          career-url: https://www.accenture.com/in-en/careers/jobsearch
          max-jobs: 120
          max-detail-fetches: 45
          search-terms:
            - java
            - spring boot
            - java microservices
            - backend developer
          options:
            cxsBase: https://accenture.wd103.myworkdayjobs.com/wday/cxs/accenture/AccentureCareers
            externalBase: https://accenture.wd103.myworkdayjobs.com/AccentureCareers
            countryFacetId: c4f78be1a8f14da0ab49ce1162348a5e
        - id: tekion
          name: Tekion
          enabled: true
          connector: ASHBY
          career-url: https://tekion.com/careers
          max-jobs: 200
          options:
            board: tekion
---
apiVersion: v1
kind: Secret
metadata:
  name: jobpulse-db
  namespace: jobpulse
type: Opaque
stringData:
  username: jobpulse
  password: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobpulse
  namespace: jobpulse
  labels:
    app: jobpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobpulse
  template:
    metadata:
      labels:
        app: jobpulse
    spec:
      containers:
        - name: jobpulse
          image: jobpulse:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/jobpulse
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jobpulse-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobpulse-db
                  key: password
            # The Windows store does not exist in a Linux container; blank falls back
            # to the JDK truststore.
            - name: JOBPULSE_CRAWL_TRUSTSTORETYPE
              value: ""
          volumeMounts:
            - name: companies
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: companies
          configMap:
            name: jobpulse-companies
---
apiVersion: v1
kind: Service
metadata:
  name: jobpulse
  namespace: jobpulse
spec:
  selector:
    app: jobpulse
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobpulse
  namespace: jobpulse
spec:
  rules:
    - host: jobpulse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobpulse
                port:
                  number: 80
