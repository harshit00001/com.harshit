# Server Configuration
server.port=8080

# Application Name
spring.application.name=springboot-interview-questions

# Database Configuration (H2 for demo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.serviceD.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.serviceD.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.serviceD.sliding-window-size=10

