server:
  port: 8085

spring:
  application:
    name: kafka-microservice-lab
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: com.harshit.kafkalab.model
        spring.json.use.type.headers: true
        spring.json.value.default.type: com.harshit.kafkalab.model.OrderEvent

app:
  kafka:
    order-topic: order-events

logging:
  level:
    com.harshit.kafkalab: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
