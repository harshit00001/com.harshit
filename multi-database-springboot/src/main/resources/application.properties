# Application Configuration
spring.application.name=multi-database-springboot
server.port=8080

# ============================================
# PRIMARY DATABASE (MySQL) Configuration
# ============================================
spring.datasource.primary.url=jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.primary.username=root
spring.datasource.primary.password=root
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

# Primary JPA Configuration
spring.jpa.primary.hibernate.ddl-auto=update
spring.jpa.primary.show-sql=true
spring.jpa.primary.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.primary.properties.hibernate.format_sql=true

# ============================================
# SECONDARY DATABASE (PostgreSQL) Configuration
# ============================================
spring.datasource.secondary.url=jdbc:postgresql://localhost:5432/orderdb?createDatabaseIfNotExist=true
spring.datasource.secondary.username=postgres
spring.datasource.secondary.password=postgres
spring.datasource.secondary.driver-class-name=org.postgresql.Driver

# Secondary JPA Configuration
spring.jpa.secondary.hibernate.ddl-auto=update
spring.jpa.secondary.show-sql=true
spring.jpa.secondary.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.secondary.properties.hibernate.format_sql=true

# ============================================
# Alternative: Using H2 for Demo (if MySQL/PostgreSQL not available)
# ============================================
# Uncomment below and comment above if using H2 for both databases

