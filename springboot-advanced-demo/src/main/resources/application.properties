# ============================================
# SPRING BOOT PERFORMANCE OPTIMIZATION DEMO
# Interview Question 1: Performance Strategies
# ============================================

# Server Configuration
server.port=8080
server.compression.enabled=true

# ============================================
# STRATEGY 1: Connection Pool Configuration (HikariCP)
# ============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 Database Configuration (In-Memory for Demo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true


# ============================================
# STRATEGY 3: Cache Configuration
# ============================================
spring.cache.type=simple
spring.cache.cache-names=users,products,orders

# ============================================
# STRATEGY 6: HTTP Compression (already enabled above)
# server.compression.enabled=true
# ============================================

# ============================================
# STRATEGY 7: Actuator Configuration
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always

# Application Properties (for @ConfigurationProperties demo)
app.name=Spring Boot Performance Demo
app.version=1.0.0
app.features=performance,caching,async,scheduling

# Database Configuration Properties
app.database.url=jdbc:h2:mem:testdb
app.database.username=sa
app.database.password=
app.database.max-connections=20

# Logging Configuration
logging.level.com.harshit.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cache=DEBUG
