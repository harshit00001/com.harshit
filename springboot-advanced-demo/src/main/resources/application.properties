# Server Configuration
server.port=8080
server.compression.enabled=true

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=users,products,orders

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always

# Application Properties
app.name=Spring Boot Advanced Demo
app.version=1.0.0
app.features=performance,caching,async,scheduling

# Feature Flags
feature.email.enabled=true
feature.cache.enabled=true
task.sync.enabled=true

# Logging
logging.level.com.harshit.demo=DEBUG
logging.level.org.springframework.web=INFO

