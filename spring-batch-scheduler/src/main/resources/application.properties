# Application Configuration
spring.application.name=spring-batch-scheduler

# H2 Database Configuration (in-memory for demo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for viewing data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Batch Configuration
spring.batch.job.enabled=false
# Interview Point: Set to false so scheduler controls when jobs run
# If true, job would run on application startup

# Logging
logging.level.com.harshit.batch=DEBUG
logging.level.org.springframework.batch=INFO

