# ====================================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ====================================================================================
# This file replaces hibernate.cfg.xml and persistence.xml
# Spring Boot uses this file for all configuration - database, JPA, Hibernate, etc.
# ====================================================================================

# ====================================================================================
# APPLICATION BASIC SETTINGS
# ====================================================================================
spring.application.name=hibernate-jpa-interview-prep
server.port=8080

# ====================================================================================
# DATABASE CONFIGURATION
# ====================================================================================
# H2 Database Configuration (In-Memory Database)
# H2 is perfect for learning and testing - no setup required!
# Data is stored in memory and lost when application stops
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
# Enable H2 console to view database in browser
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====================================================================================
# JPA / HIBERNATE CONFIGURATION
# ====================================================================================
# JPA Properties
# These properties configure JPA and Hibernate behavior

# DDL Auto Mode
# create-drop: Drop and create schema on startup and shutdown (for testing)
# create: Create schema on startup, drop on shutdown
# update: Update schema on startup (adds new tables/columns, doesn't delete)
# validate: Only validate schema, don't make changes
# none: Don't do anything with schema
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL in console
# true: Print all SQL queries to console (great for learning!)
# false: Don't print SQL (production)
spring.jpa.show-sql=true

# Format SQL output
# Makes SQL queries more readable in console
spring.jpa.properties.hibernate.format_sql=true

# SQL Dialect
# Tells Hibernate which database-specific SQL to use
# H2Dialect for H2, MySQL8Dialect for MySQL, PostgreSQLDialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ====================================================================================
# HIBERNATE SPECIFIC PROPERTIES
# ====================================================================================
# Connection Pool Settings
spring.jpa.properties.hibernate.connection.pool_size=5

# Enable second-level cache (optional - requires cache provider)
# spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.EhCacheRegionFactory

# Naming Strategy
# Physical naming strategy: converts camelCase to snake_case
# Example: firstName -> first_name in database
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ====================================================================================
# LOGGING CONFIGURATION
# ====================================================================================
# Logging levels
# DEBUG: Very detailed information (includes SQL queries)
# INFO: General information
# WARN: Warning messages
# ERROR: Error messages
logging.level.root=INFO
logging.level.com.harshit=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ====================================================================================
# SPRING DATA JPA CONFIGURATION
# ====================================================================================
# Enable JPA repositories
spring.data.jpa.repositories.enabled=true

# ====================================================================================
# TRANSACTION CONFIGURATION
# ====================================================================================
# Default transaction timeout (in seconds)
spring.transaction.default-timeout=30

# ====================================================================================
# PRODUCTION DATABASE CONFIGURATION (COMMENTED OUT)
# ====================================================================================
# Uncomment and configure for MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/your_database?useSSL=false&serverTimezone=UTC
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update

# Uncomment and configure for PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/your_database
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ====================================================================================
# SPRING BOOT ACTUATOR (Optional - for monitoring)
# ====================================================================================
# Uncomment to enable Actuator endpoints:
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=always

# ====================================================================================
# SWAGGER/OPENAPI CONFIGURATION
# ====================================================================================
# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

